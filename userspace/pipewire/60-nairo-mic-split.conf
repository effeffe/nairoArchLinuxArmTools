# Separate "Bottom Microphone" and "Top Microphone" sources for the Moto G
# 5G Plus, taken from the two channels of the stereo internal microphone
# source (left: AMIC1, bottom; right: AMIC3, top).
#
# Both microphones are read through one PCM, which UCM can only expose as
# one source per profile; the split is done here instead.
#
# Install in ~/.config/pipewire/pipewire.conf.d/ and restart pipewire.

context.modules = [
	{
		name = libpipewire-module-loopback
		args = {
			node.description = "Bottom Microphone"
			capture.props = {
				node.name = "capture.nairo_mic_bottom"
				audio.position = [ FL ]
				stream.dont-remix = true
				target.object = "alsa_input.platform-sound.HiFi__Mic__source"
				node.passive = true
			}
			playback.props = {
				node.name = "nairo_mic_bottom"
				media.class = "Audio/Source"
				audio.position = [ MONO ]
			}
		}
	}
	{
		name = libpipewire-module-loopback
		args = {
			node.description = "Top Microphone"
			capture.props = {
				node.name = "capture.nairo_mic_top"
				audio.position = [ FR ]
				stream.dont-remix = true
				target.object = "alsa_input.platform-sound.HiFi__Mic__source"
				node.passive = true
			}
			playback.props = {
				node.name = "nairo_mic_top"
				media.class = "Audio/Source"
				audio.position = [ MONO ]
			}
		}
	}
]
