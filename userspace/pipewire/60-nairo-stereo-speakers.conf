# Experimental "Stereo Speakers" sink for the Moto G 5G Plus: the left
# channel plays on the loudspeaker, the right one on the earpiece.
#
# Stock firmware keeps the earpiece out of media playback, and one DSP
# stream can only reach one backend on mainline (q6routing), so the two
# outputs are combined here, in PipeWire, from their own sinks. Both need
# to be in the active profile.
#
# Not usable with the current UCM profile, which puts every output on
# MultiMedia1 and so in a profile of its own (one sink per profile, for
# callaudiod); kept for reference. It worked with Earpiece on MultiMedia1
# and Speaker on MultiMedia3 in one profile.
#
# Install in ~/.config/pipewire/pipewire.conf.d/ and restart pipewire.

context.modules = [
	{
		name = libpipewire-module-combine-stream
		args = {
			combine.mode = sink
			node.name = "nairo_stereo_speakers"
			node.description = "Stereo Speakers"
			combine.latency-compensate = true
			combine.props = {
				audio.position = [ FL FR ]
			}
			stream.rules = [
				{
					matches = [ { node.name = "alsa_output.platform-sound.HiFi__Speaker__sink" } ]
					actions = {
						create-stream = {
							combine.audio.position = [ FL ]
							audio.position = [ MONO ]
						}
					}
				}
				{
					matches = [ { node.name = "alsa_output.platform-sound.HiFi__Earpiece__sink" } ]
					actions = {
						create-stream = {
							combine.audio.position = [ FR ]
							audio.position = [ MONO ]
						}
					}
				}
			]
		}
	}
]
