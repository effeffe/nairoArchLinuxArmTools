# nairo: the ADSP firmware plays 24- and 32-bit PCM as silence (only 16-bit
# reaches the codec), so open the built-in sound card as S16LE.
#
# Install in /etc/wireplumber/wireplumber.conf.d/ and restart wireplumber.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.platform-sound.*" }
      { node.name = "~alsa_input.platform-sound.*" }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
      }
    }
  }
]
