# Motorola Moto G 5G Plus (nairo): WCD9380 behind the LPASS RX/TX macros.
# The loudspeaker is an AW882xx amplifier on secondary MI2S.

SectionVerb {
	Value {
		TQ "HiFi"
	}

	# All outputs play from MultiMedia1, which each output device routes
	# to its own backend (a front end feeds one backend only); MultiMedia2
	# records from the WCD938x. A front end needs a backend route to open,
	# so the loudspeaker route is set up front.
	#
	# Sharing the PCM puts each output in its own profile, so the active
	# profile has a single sink: callaudiod makes the first sink of the
	# card the default output.
	EnableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 1"
	]

	DisableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer TX_CODEC_DMA_TX_3' 0"
	]
}

SectionDevice."Speaker" {
	Comment "Speaker"

	ConflictingDevice [
		"Earpiece"
		"Headphones"
	]

	EnableSequence [
		cset "name='Speaker Channel Select' Mono"
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	Value {
		PlaybackPriority 150
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "Speaker"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	ConflictingDevice [
		"Headphones"
		"Speaker"
	]

	# The EAR PA is fed by RX1, whose samples use the HPH SoundWire
	# port: HPHL Switch has to be on for the earpiece too. Both channels
	# are mixed into the earpiece interpolator, 6 dB down: (L + R) / 2.
	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP1' RX1"
		cset "name='RX_RX0 Digital Volume' 78"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX HPH Mode' CLS_H_LOHIFI"
		cset "name='RX_HPH PWR Mode' LOHIFI"
		cset "name='CLSH Switch' 1"
		cset "name='HPHL Switch' 1"
		cset "name='RDAC3_MUX' RX1"
		cset "name='RX_EAR Mode Switch' 1"
		cset "name='EAR_RDAC Switch' 1"
		# 0 dB: the control counts down, from +6 dB at 0 to -18 dB at 16
		cset "name='EAR_PA Volume' 4"
	]

	DisableSequence [
		cset "name='EAR_RDAC Switch' 0"
		cset "name='RX_EAR Mode Switch' 0"
		cset "name='RX_RX0 Digital Volume' 84"
		cset "name='RX INT0_1 MIX1 INP1' ZERO"
		cset "name='RX_MACRO RX1 MUX' ZERO"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='RX_MACRO RX0 MUX' ZERO"
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"Earpiece"
		"Speaker"
	]

	EnableSequence [
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='SEC_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	Include.wcdhpe.File "/codecs/wcd938x/HeadphoneEnableSeq.conf"
	Include.wcdhpd.File "/codecs/wcd938x/HeadphoneDisableSeq.conf"
	Include.rxmhpe.File "/codecs/qcom-lpass/rx-macro/HeadphoneEnableSeq.conf"
	Include.rxmhpd.File "/codecs/qcom-lpass/rx-macro/HeadphoneDisableSeq.conf"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackMixerElem "HP"
		JackControl "Headphone Jack"
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphones"

	ConflictingDevice [
		"Headset"
	]

	# Stereo pair as on stock: AMIC1 (bottom, main) on ADC1 -> DEC0 is the
	# left channel, AMIC3 (top, next to the earpiece) on ADC2 -> DEC1 the
	# right one.
	EnableSequence [
		cset "name='ADC1_MIXER Switch' 1"
		cset "name='ADC1 Switch' 1"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='ADC1 Volume' 8"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' ADC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 1"
		cset "name='TX_DEC0 Volume' 84"
		cset "name='ADC2_MIXER Switch' 1"
		cset "name='HDR12 MUX' NO_HDR12"
		cset "name='ADC2 MUX' INP3"
		cset "name='ADC2 Switch' 1"
		cset "name='TX1 MODE' ADC_NORMAL"
		cset "name='ADC2 Volume' 8"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' ADC1"
		cset "name='TX_AIF1_CAP Mixer DEC1' 1"
		cset "name='TX_DEC1 Volume' 84"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC1' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' 0"
		cset "name='ADC2 Switch' 0"
		cset "name='ADC2_MIXER Switch' 0"
		cset "name='ADC1 Switch' 0"
		cset "name='ADC1_MIXER Switch' 0"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 2
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	ConflictingDevice [
		"Mic"
	]

	Include.wcdmice.File "/codecs/wcd938x/HeadphoneMicEnableSeq.conf"
	Include.wcdmicd.File "/codecs/wcd938x/HeadphoneMicDisableSeq.conf"
	Include.txmhpe.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicEnableSeq.conf"
	Include.txmhpd.File "/codecs/qcom-lpass/tx-macro/HeadphoneMicDisableSeq.conf"

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		JackControl "Mic Jack"
		JackHWMute "Mic"
	}
}
